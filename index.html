<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f8fa" />
    <meta name="description" content="Vetor Global — notícias, mercados, economia e cripto com contexto para entender o que importa." />
    <meta name="robots" content="index,follow" />
    <meta property="og:title" content="Vetor Global — Informação que move decisões" />
    <meta property="og:description" content="Notícia → contexto → impacto. Brasil, mundo, mercados, cripto, tecnologia, saúde e ciência." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&display=swap" rel="stylesheet" />
    <title>Vetor Global — Informação que move decisões</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        const atualizarStatus = () => {
          const spans = document.querySelectorAll('span');
          for (const span of spans) {
            if (span.textContent.trim() === '● EM ATUALIZAÇÃO') {
              const agora = new Intl.DateTimeFormat('pt-BR', { hour: '2-digit', minute: '2-digit' }).format(new Date());
              span.textContent = `● Atualizado às ${agora}`;
            }
          }
        };
        const observer = new MutationObserver(atualizarStatus);
        observer.observe(document.documentElement, { childList: true, subtree: true, characterData: true });
        document.addEventListener('DOMContentLoaded', atualizarStatus);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
